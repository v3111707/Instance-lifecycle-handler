[project]
name = "g2c-instance-handler"
version = "0.0.1"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "sentry-sdk>=2.34.1,<3.0.0",
    "aio-pika>=10.0.1,<11.0.0",
    "pyjwt>=2.10.1,<3.0.0",
    "prometheus-client>=0.22.1,<1.0.0",
    "aiohttp>=3.12.15,<4.0.0",
    "requests>=2.32.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g2c_instance_handler", "src/cmdb_client"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E731"]

[tool.pyright]
typeCheckingMode = "basic"
# reportMissingTypeArgument = false
[tool.mypy]
disallow_any_generics = false
